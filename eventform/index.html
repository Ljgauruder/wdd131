<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎟️%3C/text%3E%3C/svg%3E">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Event Ticket</h1>
            
            <form id="ticketForm" novalidate>
                <!--Name Row-->
                <div class="form-row grid-2">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>

                <!--Email Row-->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <!--Type and Date Row-->
                <div class="form-row grid-2">
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" name="type" required>
                            <option value="">Choose one</option>
                            <option value="student">Student</option>
                            <option value="guest">Guest</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="eventDate">Event Date</label>
                        <input type="date" id="eventDate" name="eventDate" required>
                    </div>
                </div>

                <!--Hidden Fields Row-->
                <div id="studentField" class="form-group conditional-field hidden">
                    <label for="studentId">Student I#</label>
                    <input type="text" id="studentId" name="studentId" maxlength="9" pattern="\d{9}">
                </div>

                <div id="guestField" class="form-group conditional-field hidden">
                    <label for="accessCode">Access Code</label>
                    <input type="text" id="accessCode" name="accessCode" maxlength="9">
                </div>

                <button type="submit" class="btn-submit">Create Ticket</button>
            </form>
            
            <!--Error Messages & Success Messages (Below Form)-->
            <div id="errorContainer" class="error-container hidden">
                <ul id="errorList"></ul>
            </div>

            <div id="successContainer" class="success-container hidden">
                <h2>Ticket Created</h2>
                <div class="ticket-info">
                    <p id="successName"></p>
                    <p id="successType"></p>
                    <p id="successDate"></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
