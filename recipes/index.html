<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <script defer src="script.js"></script>

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="Discover delicious recipes from our collection. Search and filter by name, description, or tags.">
    <meta property="og:url" content="https://YOUR-USERNAME.github.io/wdd131/recipes/">
    <meta property="og:image" content="https://YOUR-USERNAME.github.io/wdd131/recipes/social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="Discover delicious recipes from our collection. Search and filter by name, description, or tags.">
    <meta name="twitter:image" content="https://YOUR-USERNAME.github.io/wdd131/recipes/social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body>
    <header>
        <div class="logo">
            <img src="recipe-book.png" alt="Recipe Book Logo">
            <h1>RECIPEBOOK</h1>
        </div>
        
        <div class="search-container">
            <input type="text" id="search" placeholder="Find a recipe" aria-label="Search recipes">
            <img src="search.svg" alt="Search" class="search-icon">
        </div>
    </header>
    <hr>
    <main>
        <div id="recipe-container"></div>
    </main>

    <footer>
        <div class="social">
            <a href="#"><img src="instagram_icon.svg" alt="Instagram"></a>
            <a href="#"><img src="youtube_icon.svg" alt="YouTube"></a>
            <a href="#"><img src="pinterest_icon.svg" alt="Pinterest"></a>
        </div>
        <p>
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
                Recipe icons created by Freepik - Flaticon
            </a>
        </p>
    </footer>
</body>
</html>
