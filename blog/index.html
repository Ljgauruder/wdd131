<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kids Read For Fun book blog - Reviews and recommendations for young readers.">
    <title>Kids Read For Fun</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kids Read For Fun</h1>
            <hr>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="#about">About</a></li>
                    <li><a href="#archive">Archive</a></li>
                    <li><a href="#search">Search</a></li>
                </ul>
            </nav>
        </header>
        <hr>
        <main>
            <article class="book-review" aria-labelledby="book-title">
                <div class="review-grid">
                    <div class="review-details">
                        <p class="date">July 5, 2022</p>
                        <p class="age">10-14</p>
                        <p class="genre">Fantasy</p>
                        <div class="rating" aria-label="Rated 4 out of 5 stars">⭐⭐⭐⭐</div>
                    </div>
                    <div class="review-content">
                        <h2 id="book-title" class="book-title">Septimus Heap Book One: Magyk</h2>
                        <img 
                            src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg" 
                            alt="Book cover of Septimus Heap: Magyk by Angie Sage. The cover shows an ornate magical book with a golden key, ring, and mystical symbols on a dark teal background."
                            class="book-cover"
                            width="220"
                        >
                        <p class="description">
                            If you enjoy stories about seventh sons of seventh sons and magyk this is the book for you.
                        </p>
                    </div>
                </div>
                <div class="review-footer">
                    <hr>
                    <p class="reviewer">Jane Doe</p>
                </div>
            </article>
        </main>
    </div>
</body>
</html>
